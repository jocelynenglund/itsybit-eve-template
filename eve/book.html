<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Book</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one reading column of chapters and slices; a feedback bar pinned to the bottom. Sticky-note colours carry meaning. */
  /* The Event Book look (eventpad.itsybit.se): a warm paper wall with sticky notes. Fraunces / Atkinson Hyperlegible / IBM Plex Mono. Works offline with system fonts. */
  --paper:#f6f1e7; --dots:rgba(120,90,40,.08); --surface:#fffaf0; --hover:#efe7d8; --ink:#2b241c; --muted:#75675a; --line:#d9ccb6; --line2:#cdbfa6;
  --accent:#2b241c; --on-accent:#fffaf0; --jam:#e0703a;
  /* type colours: bars and dots, then the sticky notes themselves */
  --event:#f59a4a; --command:#5b9be6; --view:#6cbf5a; --auto:#a58be0;
  --n-command:#a9cdf5; --t-command:#0e2a4a; --n-event:#ffc58a; --t-event:#4a2306; --n-view:#b6e3a8; --t-view:#163b10; --n-auto:#d9c8f5; --t-auto:#2a1a4d;
  --lane-top:#e8e6dc; --lane-ev:#f3e2cd;
  --warn:#b4442f; --pass:#2f8f57; --fail:#b4442f;
  --note-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 12px -4px rgba(80,55,20,.30);
  --display:"Fraunces",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
/* Event Book itself is light only; this is the same paper wall at night. The notes keep their colours. */
@media (prefers-color-scheme: dark){
  :root{ --paper:#1b1713; --dots:rgba(255,235,200,.05); --surface:#25201b; --hover:#2f2923; --ink:#efe6d8; --muted:#a89b8c; --line:#3a332b; --line2:#4a4137;
    --accent:#efe6d8; --on-accent:#1b1713; --lane-top:#24221d; --lane-ev:#2e2419; --warn:#ff8a73; --pass:#6cbf5a; --fail:#ff8a73;
    --note-shadow:0 1px 0 rgba(0,0,0,.2),0 6px 14px -4px rgba(0,0,0,.6); color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:radial-gradient(var(--dots) 1px,transparent 1.2px);background-size:7px 7px;color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{margin:0;text-wrap:balance} h1{font:700 24px/1.15 var(--display);letter-spacing:-.01em} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
a{color:var(--ink);text-decoration-color:var(--line2);text-underline-offset:2px} a:hover{text-decoration-color:var(--ink)}
code,.mono{font-family:var(--mono);font-size:.92em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
header.top .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.brand{display:flex;gap:12px;align-items:flex-start}
.brand .mark{margin-top:3px;flex:none}
.mark svg{width:40px;height:34px;display:block}
.brand small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
/* Book | Board | … switch: Event Book's view switch */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:0 12px;height:30px;border-radius:9px;font:700 14px var(--body);cursor:pointer;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* Board: the traditional Event Modeling timeline. Columns are slices in plan order; commands and views on top, events below. */
main.board-main{padding:14px 0 110px}
/* App tab: the app itself, in a phone- or laptop-sized frame */
.appbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 12px;padding:0 16px}
.appframe{display:block;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 18px 40px -26px rgba(80,55,20,.6);height:min(760px,calc(100vh - 220px))}
.appframe.phone{width:390px;max-width:calc(100% - 32px)} .appframe.laptop{width:calc(100% - 32px);max-width:1100px;border-radius:10px}
.export-note{border-left:6px solid var(--command)}
.export-note ul{margin:2px 0;padding-left:20px;display:grid;gap:2px;max-width:72ch}
.export-note q{font-style:italic}
.board-hint{max-width:900px;margin:0 auto 10px;padding:0 16px;color:var(--muted);font-size:13px}
.board{position:relative;overflow-x:auto;padding:4px 16px 24px}
.board svg.arrows{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:1}
.bwrap{display:flex;gap:0;align-items:stretch;width:max-content;margin:0 auto}
.blabels{display:grid;grid-template-rows:40px minmax(150px,auto) 1fr;gap:48px;padding-right:8px;position:sticky;left:-16px;z-index:2;background:var(--paper)}
.blabels span{font:700 10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;justify-self:center}
.bch{display:grid;grid-template-rows:40px auto;border-left:2px solid var(--line)}
.bch-name{font:700 19px/40px var(--display);color:var(--ink);white-space:nowrap;padding:0 12px}
.bcols{display:flex;gap:0}
.bcol{display:grid;grid-template-rows:minmax(150px,auto) minmax(110px,auto);gap:48px;width:186px;border-left:1px dashed var(--line2)}
.bcol:first-child{border-left:0}
.blane{display:flex;flex-direction:column;gap:10px;justify-content:flex-start;padding:14px 12px;background:var(--lane-ev)}
.blane.top{justify-content:flex-end;background:var(--lane-top)}
.sticky{all:unset;box-sizing:border-box;position:relative;z-index:2;display:flex;flex-direction:column;gap:3px;width:160px;min-height:74px;padding:10px 12px 11px;border-radius:3px;background:var(--n);color:var(--t);font:700 16px/1.15 var(--display);box-shadow:var(--note-shadow);overflow-wrap:anywhere;transform:rotate(var(--tilt,0deg));transition:transform .12s}
.bcol:nth-child(odd) .sticky{--tilt:-.6deg} .bcol:nth-child(even) .sticky{--tilt:.5deg}
button.sticky{cursor:pointer} button.sticky:hover{transform:rotate(0deg) translateY(-1px)}
button.sticky:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sticky small{font:700 9.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.1em;opacity:.72}
.sticky.command{--n:var(--n-command);--t:var(--t-command)} .sticky.view{--n:var(--n-view);--t:var(--t-view)} .sticky.automation{--n:var(--n-auto);--t:var(--t-auto)} .sticky.event{--n:var(--n-event);--t:var(--t-event);min-height:62px}
.sticky .st{margin-top:auto;padding-top:6px;font:500 10.5px/1 var(--mono);opacity:.7}
.sticky .st.built,.sticky .st.refined{opacity:1;font-weight:700}
.bempty{height:62px}
/* Scrolled down: the header folds to one slim row (logo, title, counts); back at the top it opens again. */
body.scrolled header.top .wrap{flex-wrap:nowrap;padding-top:7px;padding-bottom:7px;gap:12px}
body.scrolled .brand{align-items:center;min-width:0;gap:8px}
body.scrolled .brand .mark{margin-top:0}
body.scrolled .mark svg{width:26px;height:22px}
body.scrolled h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.scrolled .brand small{display:none}
body.scrolled .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;font-size:12px}
@media (max-width:640px){ body.scrolled .pills .pill:not(.ok):not(.link){display:none} }
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--surface);color:var(--muted);white-space:nowrap;text-decoration:none;font:700 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.pill.ok{color:var(--ink);border-color:var(--ink)}
.pill.link{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font:700 13px/1.4 var(--body);text-transform:none;letter-spacing:0;padding:4px 13px}
.pill.link:hover{opacity:.88}
main{padding:18px 0 120px}
.stack{display:grid;gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.note.go{border-color:var(--pass);border-left:6px solid var(--pass)}
.note.new{border-left:6px solid var(--jam)}
.eve-notes{margin:2px 0 4px;padding-left:20px;display:grid;gap:2px;max-width:72ch}
.chapter{display:grid;gap:8px;margin-top:14px}
.chapter>h2{font:700 22px/1.15 var(--display);color:var(--ink);padding:2px 2px 6px;border-bottom:2px solid var(--ink)}
/* A slice: Event Book's outline row, a card with a rounded type bar at its left */
.slice{--bar:var(--command);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 24px;display:grid;gap:10px}
.slice::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:6px;border-radius:3px;background:var(--bar)}
.slice.view{--bar:var(--view)} .slice.automation{--bar:var(--auto)}
.slice.is-refined{border-color:var(--line2)}
.slice h3{font:700 18px/1.2 var(--display)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}
.tag{font:700 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:5px 7px;border-radius:3px;white-space:nowrap}
.tag.command{background:var(--n-command);color:var(--t-command)}
.tag.view{background:var(--n-view);color:var(--t-view)}
.tag.automation{background:var(--n-auto);color:var(--t-auto)}
.tag.new{background:var(--jam);color:#fffaf0}
.ev{font:700 14px/1.35 var(--display);color:var(--t-event);background:var(--n-event);border-radius:3px;padding:0 6px;white-space:nowrap}
.muted{color:var(--muted);font-size:13px}
/* Refined: a tick box in ink (green would read as a view) */
.refined{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;font:700 13px var(--body);color:var(--muted);background:var(--surface);user-select:none}
.refined input{width:15px;height:15px;accent-color:var(--ink);margin:0}
.refined.on{border-color:var(--ink);color:var(--ink)}
.badge{font:700 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.pass{color:var(--pass);border-color:var(--pass)} .badge.fail{color:var(--fail);border-color:var(--fail)}
.slice.done{padding:8px 14px 8px 24px;box-shadow:none}
.slice.done::before{top:8px;bottom:8px}
.done-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.filters{gap:8px 12px}
.search input{padding:10px 14px;border-radius:999px}
.seg.filter{flex-wrap:wrap}
.seg button .n{font:500 11px var(--mono);opacity:.75;margin-left:2px}
.sc-row{flex-wrap:nowrap;align-items:flex-start}
.sc-row .dot{margin-top:5px}
.sc-row .name{flex:1;min-width:0;font:700 15px/1.3 var(--display);color:var(--ink)}
.sc-row .chev{margin-top:3px;white-space:nowrap}
.sc:has(.sc-row){padding-top:8px}
.tried{gap:6px 8px}
.btn.on{border-color:var(--pass);color:var(--pass)}
.fold-row{width:auto;flex:1;min-width:0}
.done-row .name{color:var(--muted);font:700 16px var(--display)} .done-row .chev{margin-left:auto;color:var(--muted);font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.chapter.done-ch>h2 .muted{font:400 14px var(--body)}
.sc{border-top:1px dashed var(--line2);padding-top:10px;display:grid;gap:6px}
.sc-title{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sc-title strong{font:700 15px var(--display);display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line2);flex:none}
.dot.pass{background:var(--pass);border-color:var(--pass)} .dot.fail{background:var(--fail);border-color:var(--fail)}
.gwt{display:grid;grid-template-columns:52px 1fr;gap:3px 8px;align-items:baseline}
.gwt .k{font:700 10px/24px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gwt .v{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;min-height:24px;font-size:14px}
.refuse{font:700 12px/1.3 var(--mono);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:3px;padding:1px 6px;white-space:nowrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font:700 13px var(--body);white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{opacity:.88}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:3px 9px;font-size:12px}
.btn.quiet:hover{color:var(--ink);background:var(--hover)}
.btn:disabled,.btn.primary:disabled{background:transparent;border-color:var(--line);color:var(--muted);cursor:default;opacity:1}
/* Reading comfort: prose stops at about 72 characters a line, however wide the window. */
.note p,.look p,.brand small,.cm>span:last-child,.sl-desc{max-width:72ch}
.thread{border-left:3px solid var(--line);padding-left:10px;display:grid;gap:4px}
.thread.resolved .cm{color:var(--muted)}
.cm{display:grid;gap:1px;font-size:14px}
.cm .who{font-size:12px;color:var(--muted)}
.cm .who b{color:var(--ink)}
.cm.ai .who b{color:var(--jam)}
.cm.draft .who::after{content:" · not sent yet";color:var(--jam)}
.composer{display:grid;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px}
textarea,input[type=text],input[type=search],select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;width:100%}
textarea:focus,input[type=text]:focus,input[type=search]:focus,select:focus{border-color:var(--ink);outline:none}
textarea{min-height:64px;resize:vertical}
.chip{font:700 13px/1.3 var(--display);border:1.5px dashed var(--line2);background:transparent;border-radius:3px;padding:3px 8px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-style:solid;border-color:transparent;background:var(--n-event);color:var(--t-event);box-shadow:var(--note-shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.look{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--jam);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.look .chip{font:700 13px var(--body);border-radius:999px;padding:4px 11px}
.look .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{display:inline-flex;gap:4px;align-items:center}
.swatch input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.dot-sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
input[type=radio],input[type=checkbox]{accent-color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 20px -14px rgba(40,26,15,.35);z-index:5}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}
.empty{background:var(--surface);border:1.5px dashed var(--line2);border-radius:12px;padding:24px;display:grid;gap:8px;max-width:60ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){.gwt{grid-template-columns:46px 1fr}}
</style>

<body>
<div id="book"></div>
<script>
"use strict";
/* The Event Book: read the plan, leave feedback, save it as a round for the AI. */
const params = new URLSearchParams(location.search);
const ROOT = params.get("root") || "../";
const POLL_MS = 4000;

let model = null, modelText = "", built = null, builtText = "", loadError = "";
let draft = { events: [], sent: "" };
const ui = { compose: null, addFor: null, form: null, saving: false, message: "", newRound: false, openDone: new Set(), openSc: new Set(), filter: "all", q: "", lookForm: null, appWidth: "phone", appExists: null, mode: (() => { try { return localStorage.getItem("eve-mode") === "board" ? "board" : "book"; } catch (e) { return "book"; } })() };

/* ---------- loading ---------- */
async function fetchText(path) {
  const res = await fetch(ROOT + path + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(res.status + " " + path);
  return res.text();
}
async function loadAll(first) {
  try {
    const text = await fetchText("plan/model.json");
    if (text !== modelText) {
      const next = JSON.parse(text);
      const roundChanged = model && next.round !== model.round;
      if (first || !busy()) { model = next; modelText = text; loadDraft(); if (roundChanged) ui.message = "Round " + model.round + " is here. Your AI has answered."; }
      else if (roundChanged) ui.newRound = true;
    }
    loadError = "";
  } catch (e) { if (first) loadError = String(e.message || e); }
  try {
    const text = await fetchText("plan/built.json");
    if (text !== builtText) { builtText = text; built = indexBuilt(JSON.parse(text)); }
  } catch (e) { /* not built yet */ }
  if (first || (!busy() && ui.mode !== "app")) render(); // the App tab keeps its frame: redrawing would reload the app
}
function busy() { return !!(ui.compose || ui.addFor || ui.lookForm); }
function indexBuilt(b) {
  const map = new Map();
  for (const f of b.files || []) for (const s of f.scenarios || []) map.set(s.slice + "\u0000" + s.title, s);
  return { at: b.createdAt, map };
}

/* ---------- the feedback draft (one per round, kept in this browser) ---------- */
function draftKey() { return "eve-feedback:" + (model.app || "app") + ":" + model.round; }
function loadDraft() {
  try { draft = JSON.parse(localStorage.getItem(draftKey())) || { events: [], sent: "" }; } catch (e) { draft = { events: [], sent: "" }; }
}
function saveDraft() { try { localStorage.setItem(draftKey(), JSON.stringify(draft)); } catch (e) { /* in memory only */ } }
// Refined slices the person folded away, remembered per app in this browser.
function foldKey() { return "eve-folded:" + (model.app || "app"); }
function folded() { if (!ui.folded) { try { ui.folded = new Set(JSON.parse(localStorage.getItem(foldKey())) || []); } catch (e) { ui.folded = new Set(); } } return ui.folded; }
function setFolded(id, on) { const f = folded(); on ? f.add(id) : f.delete(id); try { localStorage.setItem(foldKey(), JSON.stringify([...f])); } catch (e) { /* in memory only */ } }
function add(type, data) { draft.events.push({ type, data, at: stamp() }); saveDraft(); render(); }
function stamp() { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
function uid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2, 8); }
const locked = () => !!draft.sent;

/* ---------- what the page shows: the plan plus this round's draft ---------- */
function view() {
  const comments = (model.comments || []).map(c => ({ ...c }));
  const added = [];
  const refined = {};
  const works = {};
  for (const sl of model.slices || []) { refined[sl.id] = !!sl.refined; works[sl.id] = !!sl.works; }
  let look = model.look || null, lookNew = false;
  for (const e of draft.events) {
    if (e.type === "LookAndFeelSet") { look = e.data; lookNew = true; }
    const d = e.data;
    if (e.type === "CommentAdded") comments.push({ id: d.commentId, sliceId: d.sliceId, scenarioId: d.scenarioId, part: d.part, threadId: d.threadId, author: "you", text: d.text, at: d.at, problem: !!d.problem, draft: true });
    if (e.type === "CommentResolved") { const c = comments.find(x => x.id === d.commentId); if (c) { c.resolved = true; c.resolvedNow = true; } }
    if (e.type === "ScenarioAdded") added.push(d);
    if (e.type === "SliceMarkedRefined") refined[d.sliceId] = true;
    if (e.type === "SliceRefinedCleared") refined[d.sliceId] = false;
    if (e.type === "SliceWorks") works[d.sliceId] = true;
  }
  return { comments, added, refined, works, look, lookNew };
}
function counts() {
  const c = { comments: 0, scenarios: 0, ticks: 0, resolved: 0, look: 0, works: 0, problems: 0 };
  for (const e of draft.events) {
    if (e.type === "CommentAdded" && e.data.problem) c.problems++;
    else if (e.type === "CommentAdded") c.comments++;
    else if (e.type === "SliceWorks") c.works++;
    else if (e.type === "ScenarioAdded") c.scenarios++;
    else if (e.type === "CommentResolved") c.resolved++;
    else if (e.type === "LookAndFeelSet") c.look = 1;
    else c.ticks++;
  }
  return c;
}

/* ---------- rendering ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const kindOf = sl => sl.type === "view" ? "view" : sl.type === "automation" ? "automation" : "command";
const kindLabel = { command: "Command", view: "View", automation: "Automation" };

function render() {
  const el = document.getElementById("book");
  if (!model) { el.innerHTML = renderEmpty(); return; }
  document.title = (model.app || "App") + " · Event Book";
  const V = view();

  // Fold built slices only while there's something new to read; a finished book shows everything.
  let done = new Set(slices.filter(s => isDone(s, V)).map(s => s.id));
  if (done.size === slices.length) done = new Set();
  const open = slices.filter(s => !done.has(s.id));
  const nOpenRefined = open.filter(s => V.refined[s.id]).length;
  const b = builtSummary();
  const chapters = (model.chapters || []).map(c => c.name);

  const orphans = slices.filter(s => !s.chapter);
  // Typing in the search box redraws the book: keep the cursor where it was.

  el.innerHTML =
    `<header class="top"><div class="wrap">
      <div class="brand"><div class="mark" aria-hidden="true" title="itsyBIT EVE"><svg viewBox="0 0 140 120"><rect x="5" y="5" width="90" height="110" rx="16" fill="#9B2335"/><circle cx="50" cy="42" r="22" fill="none" stroke="#fff" stroke-width="8"/><line x1="30" y1="92" x2="70" y2="92" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="121" cy="27" r="11" style="fill:var(--command)"/><circle cx="121" cy="60" r="11" style="fill:var(--event)"/><circle cx="121" cy="93" r="11" style="fill:var(--view)"/></svg></div>
        <div><h1>${esc(model.app || "Your app")} · Event Book</h1><small title="${esc(model.idea || "")}">Round ${esc(model.round || 1)}${model.idea ? " · " + esc(model.idea) : ""}</small></div></div>

          : `<span class="pill ${allRefined ? "ok" : ""}">${nRefined} of ${slices.length} slices refined</span>`}

    ${ui.mode === "app" ? renderApp() : ui.mode === "look" || ui.mode === "export" ? `<main><div class="wrap stack">
      ${ui.mode === "look" ? `<p class="muted">How your app should look and feel. Your AI designs from this when you say <b>make it beautiful</b>. It's sent with your feedback round.</p>${renderLook(V)}` : renderExport()}
    </div></main>` : ui.mode === "board" ? `<main class="board-main">
      ${ui.newRound ? `<div class="board-hint"><button class="btn primary" data-act="reload">Show the new round</button></div>` : ""}
      <p class="board-hint">The plan as an event model: time runs left to right. Commands and views on top, the events they cause and read below. Tap a sticky to open it in the book.</p>
      ${renderBoard(V, chapters, slices)}
      <p class="board-hint">Event Modeling is <a href="https://eventmodeling.org/about/" target="_blank" rel="noopener">Adam Dymitruk</a>'s method; this board follows it.</p></main>` : `<main><div class="wrap stack">
      ${ui.newRound ? `<div class="note new"><strong>A new round is ready.</strong><div class="row"><button class="btn primary" data-act="reload">Show the new round</button><span class="muted">Finish what you're typing first; it's saved.</span></div></div>` : ""}
      ${ui.message ? `<div class="note new" role="status">${esc(ui.message)}</div>` : ""}
      ${ui.eveUpdated ? `<div class="note new" role="status"><p><strong>EVE was updated.</strong> <span class="muted">You now have ${esc(ui.eveUpdated.version)}.</span></p>${ui.eveUpdated.notes.length ? `<ul class="eve-notes">${ui.eveUpdated.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}<div><button class="btn" data-act="eve-seen">Got it</button></div></div>` : ""}
      ${ui.eveUpdate ? `<div class="note new"><p><strong>A newer EVE is out.</strong> <span class="muted">${esc(ui.eveUpdate)}.</span></p>${ui.eveNotes && ui.eveNotes.length ? `<ul class="eve-notes">${ui.eveNotes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}<p>Tell your AI: <b>update EVE</b>. It updates the tools and leaves your plan and app alone.</p></div>` : ""}
      ${intro(allRefined, b, done.size && open.length)}

      ${!locked() ? composerOrButton({ kind: "board" }, "Add a general comment") : ""}
      <div class="search"><label class="sr" for="q">Search</label><input type="search" id="q" placeholder="Search slices, events, scenarios…" value="${esc(ui.q)}" autocomplete="off"></div>

      ${chapters.map(ch => [ch, slices.filter(s => s.chapter === ch && shown(s, V))]).filter(([, l]) => l.length).map(([ch, l]) => renderChapter(ch, l, V, done)).join("")}
      ${orphans.some(s => shown(s, V)) ? `<section class="chapter"><h2>Other</h2>${orphans.filter(s => shown(s, V)).map(s => done.has(s.id) ? renderDone(s, V) : renderOpen(s, V)).join("")}</section>` : ""}
      ${slices.some(s => shown(s, V)) ? "" : `<p class="muted">${ui.q.trim() ? `Nothing matches “${esc(ui.q.trim())}”.` : "No slices here right now."}</p>`}

    ${renderBar()}`;
  if (keep) { const q = document.getElementById("q"); if (q) { q.focus(); q.setSelectionRange(keep[0], keep[1]); } }
  if (ui.mode === "board") requestAnimationFrame(drawArrows);

/* ---------- the board: a traditional event model of the plan ---------- */
const words = n => String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1 $2");
function sliceStatus(sl, V) {
  const scen = sl.scenarios || [];
  if (built && built.map.size && scen.length && scen.every(sc => { const r = built.map.get(sl.name + "\u0000" + sc.title); return r && r.passing; })) return ["built", "✓ built"];
  return V.refined[sl.id] ? ["refined", "refined"] : ["", "not refined"];
}
function renderBoard(V, chapters, slices) {
  const groups = chapters.map(ch => [ch, slices.filter(s => s.chapter === ch)]);
  const orphans = slices.filter(s => !s.chapter);
  if (orphans.length) groups.push(["Other", orphans]);
  const col = sl => {
    const k = kindOf(sl), [cls, label] = sliceStatus(sl, V);
    const evs = k === "view" ? [] : (sl.produces || []);
    return `<div class="bcol">
      <div class="blane top"><button class="sticky ${k}" data-act="goto" data-slice="${esc(sl.id)}" data-node="s:${esc(sl.id)}" data-reads="${esc((sl.reads || []).join(" "))}"><small>${kindLabel[k]}</small>${esc(words(sl.name))}<span class="st ${cls}">${label}</span></button></div>
      <div class="blane">${evs.length ? evs.map(e => `<div class="sticky event" data-node="e:${esc(sl.id)}:${esc(e)}" data-ev="${esc(e)}" data-from="s:${esc(sl.id)}"><small>Event</small>${esc(words(e))}</div>`).join("") : `<div class="bempty"></div>`}</div>
    </div>`;
  };
  return `<div class="board" id="board"><svg class="arrows" id="arrows" aria-hidden="true"></svg><div class="bwrap">
    <div class="blabels"><span></span><span>Commands · views</span><span>Events</span></div>
    ${groups.filter(g => g[1].length).map(([ch, list]) => `<section class="bch"><div class="bch-name">${esc(ch)}</div><div class="bcols">${list.map(col).join("")}</div></section>`).join("")}
  </div></div>`;
}
// Arrows: command → the events it causes; event → each view that reads it (the latest one to its left, else any).
function drawArrows() {
  const board = document.getElementById("board"), svg = document.getElementById("arrows");
  if (!board || !svg) return;
  const b = board.getBoundingClientRect();
  const box = el => { const r = el.getBoundingClientRect(); return { l: r.left - b.left + board.scrollLeft, t: r.top - b.top, w: r.width, h: r.height }; };
  svg.setAttribute("width", board.scrollWidth); svg.setAttribute("height", board.scrollHeight);
  const paths = [];
  const line = (x1, y1, x2, y2, curve) => paths.push(curve
    ? `<path d="M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}" />`
    : `<path d="M${x1},${y1} L${x2},${y2}" />`);
  const events = [...board.querySelectorAll(".sticky.event")];
  for (const ev of events) {
    const from = board.querySelector(`[data-node="${ev.dataset.from}"]`); if (!from) continue;
    const a = box(from), c = box(ev);
    line(a.l + a.w / 2, a.t + a.h, c.l + c.w / 2, c.t - 4);
  }
  // Event → view arrows: spread their ends along each sticky's edge and give each its own height, so they don't bunch up.
  const links = [];
  for (const v of board.querySelectorAll("button.sticky.view, button.sticky.automation")) {
    const reads = (v.dataset.reads || "").split(" ").filter(Boolean); if (!reads.length) continue;
    const vb = box(v);
    for (const name of reads) {
      const cands = events.filter(e => e.dataset.ev === name);
      if (!cands.length) continue;
      const left = cands.filter(e => box(e).l < vb.l);
      links.push([(left.length ? left : cands).reduce((best, e) => (box(e).l > box(best).l ? e : best)), v]);
    }
  }
  const outs = new Map(), ins = new Map();
  for (const [e, v] of links) { outs.set(e, (outs.get(e) || 0) + 1); ins.set(v, (ins.get(v) || 0) + 1); }
  const seenOut = new Map(), seenIn = new Map();
  links.forEach(([e, v], i) => {
    const s = box(e), t = box(v);
    const io = seenOut.get(e) || 0, ii = seenIn.get(v) || 0; seenOut.set(e, io + 1); seenIn.set(v, ii + 1);
    const x1 = s.l + s.w * (0.25 + 0.6 * (io + 0.5) / outs.get(e)), y1 = s.t;
    const x2 = t.l + t.w * (0.2 + 0.6 * (ii + 0.5) / ins.get(v)), y2 = t.t + t.h + 4;
    const lift = 18 + (i % 4) * 12;
    paths.push(`<path d="M${x1},${y1} C${x1},${y1 - lift} ${x2},${y2 + lift} ${x2},${y2}" />`);
  });
  svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
    <g fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)" opacity=".75">${paths.join("")}</g>`;
}
addEventListener("resize", () => { if (ui.mode === "board") drawArrows(); });

function intro(allRefined, b, followUp) {
  if (followUp && !allRefined) return `<div class="note"><p>The new slices are open below; the ones already built are folded away (tap one to open it). Comment on the new ones, add the scenarios you're missing, and tick <b>Refined</b> when a slice is right. Then press <b>Done with feedback</b> and tell your AI <b>done</b>.</p></div>`;
  if (followUp && allRefined && !draft.events.length && b.passing < b.total) return `<div class="note go"><strong>The new slices are refined.</strong><p>Tell your AI: <b>start building</b>.</p></div>`;
  if (b.total && b.passing === b.total && allRefined) return `<div class="note go"><strong>Built.</strong><p>Every planned scenario passes. <a href="${esc(ROOT)}app/">Open the app</a>.</p></div>`;
  if (b.any) return `<div class="note"><strong>Building.</strong><p>Green dots are scenarios with a passing test. This page updates by itself as your AI works.</p></div>`;
  if (allRefined && !draft.events.length) return `<div class="note go"><strong>Every slice is refined.</strong><p>Tell your AI: <b>start building</b>.</p></div>`;
  return `<div class="note"><p>Read each slice. Comment on anything that looks wrong, add the scenarios you're missing, and tick <b>Refined</b> when a slice is right. Then press <b>Done with feedback</b> and tell your AI <b>done</b>.</p></div>`;
}

function builtSummary() {
  let total = 0, passing = 0;
  for (const sl of model.slices || []) for (const sc of sl.scenarios || []) {
    total++;
    const r = built && built.map.get(sl.name + "\u0000" + sc.title);
    if (r && r.passing) passing++;
  }
  const any = !!(built && built.map.size);
  return { total: any ? total : 0, passing, any };
}

// Built: refined, every planned scenario passes, and nothing in this round's draft touches it.
function isDone(sl, V) {
  const scen = sl.scenarios || [];
  if (!V.refined[sl.id] || !scen.length || !built || !built.map.size) return false;
  if (!scen.every(sc => { const r = built.map.get(sl.name + "\u0000" + sc.title); return r && r.passing; })) return false;
  if (V.added.some(a => a.sliceId === sl.id)) return false;
  return !V.comments.some(c => c.sliceId === sl.id && (c.draft || (c.problem && !c.resolved)));
}
// Filters: every slice is in one state. To refine (not ticked yet), Ready to build (ticked, not built), Built (every scenario passes).
const FILTERS = [["all", "All"], ["refine", "To refine"], ["ready", "Ready to build"], ["built", "Built"]];
function stateOf(sl, V) { return isDone(sl, V) ? "built" : V.refined[sl.id] ? "ready" : "refine"; }
function shown(sl, V) { return (ui.filter === "all" || stateOf(sl, V) === ui.filter) && matches(sl); }
// Search: every word typed must appear somewhere in the slice: its name, events, fields, scenarios or refusals.
function matches(sl) {
  const words_ = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words_.length) return true;
  const hay = [sl.name, words(sl.name), sl.chapter, sl.description, ...(sl.produces || []), ...(sl.reads || []), ...(sl.fields || []),
    ...(sl.scenarios || []).flatMap(sc => [sc.title, sc.when, ...(sc.given || []).map(g => g.type || g), ...((sc.then || {}).events || []).map(e => e.type || e), (sc.then || {}).rejected, (sc.then || {}).view, typeof (sc.then || {}).value === "string" ? sc.then.value : ""])]
    .filter(Boolean).join(" ").toLowerCase();
  return words_.every(w => hay.includes(w));
}
function filterSwitch(V, slices) {
  const n = { all: slices.length, refine: 0, ready: 0, built: 0 };
  for (const s of slices) n[stateOf(s, V)]++;
  return `<span class="seg filter" role="group" aria-label="Show">${FILTERS.map(([f, l]) => `<button data-act="filter" data-f="${f}" aria-pressed="${ui.filter === f}">${l} <span class="n">${n[f]}</span></button>`).join("")}</span>`;
}
// Fold or show every refined slice at once (built ones fold by themselves).
function foldAllButton(V, done) {
  const ref = (model.slices || []).filter(s => V.refined[s.id] && !done.has(s.id));
  if (ref.length < 2) return "";
  const open = ref.filter(s => !folded().has(s.id)).length;
  return `<div><button class="btn quiet" data-act="fold-all" data-on="${open ? 1 : 0}">${open ? `▾ Fold the ${ref.length} refined slices` : `▸ Show the ${ref.length} refined slices`}</button></div>`;
}
function renderChapter(ch, list, V, done) {
  const allDone = ui.filter === "all" && !ui.q.trim() && list.length && list.every(s => done.has(s.id));
  const isOpen = ui.openDone.has("ch:" + ch);
  if (allDone && !isOpen) return `<section class="chapter done-ch"><h2><button class="done-row" data-act="toggle-done" data-key="${esc("ch:" + ch)}" aria-expanded="false">${esc(ch)} <span class="muted">· ${list.length} built</span><span class="chev">▸ show</span></button></h2></section>`;
  const head = allDone ? `<h2><button class="done-row" data-act="toggle-done" data-key="${esc("ch:" + ch)}" aria-expanded="true">${esc(ch)} <span class="muted">· ${list.length} built</span><span class="chev">▾ hide</span></button></h2>` : `<h2>${esc(ch)}</h2>`;
  return `<section class="chapter ${allDone ? "done-ch" : ""}">${head}${list.map(s => done.has(s.id) && !allDone ? renderDone(s, V) : renderOpen(s, V)).join("")}</section>`;
}
function renderDone(sl, V) {
  if (ui.openDone.has(sl.id)) return renderSlice(sl, V, true);
  const k = kindOf(sl);
  return `<article class="slice ${k} done" id="slice-${esc(sl.id)}"><button class="done-row" data-act="toggle-done" data-key="${esc(sl.id)}" aria-expanded="false">
    <span class="tag ${k}">${kindLabel[k]}</span><span class="mono name">${esc(sl.name)}</span><span class="badge pass">Built</span>${V.works[sl.id] ? `<span class="badge pass">✓ Works</span>` : ""}<span class="chev">▸ show</span></button></article>`;
}

function renderOpen(sl, V) {
  if (!V.refined[sl.id] || !folded().has(sl.id)) return renderSlice(sl, V);
  const k = kindOf(sl);
  const drafts = V.comments.filter(c => c.sliceId === sl.id && c.draft).length + V.added.filter(a => a.sliceId === sl.id).length;
  return `<article class="slice ${k} done is-refined" id="slice-${esc(sl.id)}"><div class="row">
    <button class="done-row fold-row" data-act="fold" data-slice="${esc(sl.id)}" aria-expanded="false"><span class="tag ${k}">${kindLabel[k]}</span><span class="name">${esc(sl.name)}</span><span class="muted">${(sl.scenarios || []).length} scenarios${drafts ? ` · ${drafts} not sent yet` : ""}</span><span class="chev">▸ show</span></button>
    <label class="refined on"><input type="checkbox" data-act="refine" data-slice="${esc(sl.id)}" checked ${locked() ? "disabled" : ""}>Refined</label></div></article>`;
}
function renderSlice(sl, V, folded) {
  const k = kindOf(sl), on = V.refined[sl.id];
  const scen = sl.scenarios || [];
  let badge = "";
  if (built && built.map.size) {
    const res = scen.map(sc => built.map.get(sl.name + "\u0000" + sc.title));
    const pass = res.filter(r => r && r.passing).length, fail = res.filter(r => r && !r.passing).length;
    badge = pass === scen.length && scen.length ? `<span class="badge pass">Built</span>` : fail ? `<span class="badge fail">${pass}/${scen.length} pass</span>` : pass ? `<span class="badge">${pass}/${scen.length} pass</span>` : `<span class="badge">Not built</span>`;
  }
  const allPass = !!(built && built.map.size && scen.length && scen.every(sc => { const x = built.map.get(sl.name + "\u0000" + sc.title); return x && x.passing; }));
  const worksNow = draft.events.some(e => e.type === "SliceWorks" && e.data.sliceId === sl.id);
  const problem = V.comments.some(c => c.sliceId === sl.id && c.problem && !c.resolved);
  const tried = !allPass ? "" : problem ? `<div class="row tried"><span class="refuse">problem reported</span><span class="muted">Your AI fixes it after you send this round.</span></div>` : `<div class="row tried"><span class="muted">Tried it in the app?</span>${
    V.works[sl.id] && !worksNow ? `<span class="badge pass">✓ Works</span>`
    : locked() ? "" : `<button class="btn ${worksNow ? "on" : ""}" data-act="works" data-slice="${esc(sl.id)}" aria-pressed="${worksNow}">✓ Works${worksNow ? " (not sent yet)" : ""}</button>`}${
    !locked() ? `<button class="btn" data-act="compose" data-kind="problem" data-slice="${esc(sl.id)}">Doesn't work</button>` : ""}</div>
    ${ui.compose && ui.compose.kind === "problem" && ui.compose.sliceId === sl.id ? renderComposer() : ""}`;
  const flow = k === "view"
    ? `<span class="muted">from</span> ${(sl.reads || []).map(e => `<span class="ev">${esc(e)}</span>`).join(" ")}`
    : `<span class="muted">→</span> ${(sl.produces || []).map(e => `<span class="ev">${esc(e)}</span>`).join(" ")}`;
  return `<article class="slice ${k} ${on ? "is-refined" : ""}" id="slice-${esc(sl.id)}">
    <div class="row spread">
      <div class="row"><span class="tag ${k}">${kindLabel[k]}</span><h3 class="mono">${esc(sl.name)}</h3>${flow}</div>
      <div class="row">${badge}${folded ? `<button class="btn quiet" data-act="toggle-done" data-key="${esc(sl.id)}" aria-expanded="true">▾ hide</button>` : on ? `<button class="btn quiet" data-act="fold" data-slice="${esc(sl.id)}" aria-expanded="true">▾ fold</button>` : ""}
        <label class="refined ${on ? "on" : ""}"><input type="checkbox" data-act="refine" data-slice="${esc(sl.id)}" ${on ? "checked" : ""} ${locked() ? "disabled" : ""}>Refined</label></div>
    </div>
    ${tried}
    ${sl.fields && sl.fields.length ? `<p class="muted">${k === "view" ? "Shows" : "Needs"}: ${sl.fields.map(esc).join(", ")}</p>` : ""}
    ${sl.description ? `<p>${esc(sl.description)}</p>` : ""}
    ${renderThreads(V, t => t.sliceId === sl.id && !t.scenarioId)}
    ${!locked() ? composerOrButton({ kind: "slice", sliceId: sl.id }, "Comment on this slice") : ""}
    ${scen.map(sc => renderScenario(sl, sc, V)).join("")}
    ${V.added.filter(a => a.sliceId === sl.id).map(a => renderScenario(sl, { id: a.scenarioId, title: a.name, given: a.given, when: a.when, then: a.then }, V, true)).join("")}
    ${!locked() ? (ui.addFor === sl.id ? renderAddForm(sl) : `<div><button class="btn quiet" data-act="add-open" data-slice="${esc(sl.id)}">+ Add a scenario</button></div>`) : ""}
  </article>`;
}

function renderScenario(sl, sc, V, isNew) {
  const k = kindOf(sl);
  const r = built && built.map.get(sl.name + "\u0000" + sc.title);
  const dot = r ? (r.passing ? "pass" : "fail") : "";
  // A scenario whose test passes shrinks to one line, unless it has an open thread or a comment being written on it.
  const key = sl.id + "/" + sc.id;
  const roots = V.comments.filter(c => c.scenarioId === sc.id && !c.threadId);
  const talk = !isNew && (roots.some(c => !c.resolved) || V.comments.some(c => c.scenarioId === sc.id && c.draft));
  const writing = ui.compose && ui.compose.scenarioId === sc.id;
  const foldable = !isNew && r && r.passing && !talk && !writing;
  if (foldable && !ui.openSc.has(key)) return `<div class="sc"><button class="done-row sc-row" data-act="sc-open" data-key="${esc(key)}" aria-expanded="false"><span class="dot pass" title="test passes"></span><span class="name">${esc(sc.title)}</span><span class="chev">▸ show</span></button></div>`;
  const given = (sc.given || []).length ? sc.given.map(g => `<span class="ev">${esc(g.type || g)}</span>`).join(" ") : `<span class="muted">nothing</span>`;
  const when = k === "view" ? `someone opens <code>${esc(sl.name)}</code>` : `<code>${esc(sc.when || sl.name)}</code>`;
  const t = sc.then || {};
  const then = t.rejected != null ? `<span class="refuse">refused</span> “${esc(t.rejected)}”`
    : t.events ? t.events.map(e => `<span class="ev">${esc(e.type || e)}</span>`).join(" ")
    : t.view ? `shows ${esc(typeof t.value === "string" ? t.value : JSON.stringify(t.value))}`
    : `<span class="muted">nothing</span>`;
  return `<div class="sc">
    <div class="sc-title"><strong><span class="dot ${dot}" title="${r ? (r.passing ? "test passes" : "test fails") : "no test yet"}"></span>${esc(sc.title)} ${isNew ? `<span class="tag new">New</span>` : ""}</strong>
      ${foldable ? `<button class="btn quiet" data-act="sc-open" data-key="${esc(key)}" aria-expanded="true">▾ fold</button>` : ""}${isNew ? (!locked() ? `<button class="btn quiet" data-act="drop-scenario" data-id="${esc(sc.id)}">Remove</button>` : "") : (!locked() ? `<button class="btn quiet" data-act="compose" data-kind="scenario" data-slice="${esc(sl.id)}" data-scenario="${esc(sc.id)}">Comment</button>` : "")}</div>
    <div class="gwt"><span class="k">Given</span><div class="v">${given}</div>
      <span class="k">When</span><div class="v">${when}</div>
      <span class="k">Then</span><div class="v">${then}</div></div>
    ${r && !r.passing && r.error ? `<p class="muted">Test says: ${esc(r.error)}</p>` : ""}
    ${isNew ? "" : renderThreads(V, c => c.scenarioId === sc.id)}
    ${!isNew && ui.compose && ui.compose.kind === "scenario" && ui.compose.scenarioId === sc.id && !ui.compose.threadId ? renderComposer() : ""}
  </div>`;
}

function renderThreads(V, match, heading) {
  const roots = V.comments.filter(c => !c.threadId && match(c));
  if (!roots.length) return "";
  return (heading ? `<h3>${esc(heading)}</h3>` : "") + roots.map(root => {
    const replies = V.comments.filter(c => c.threadId === root.id);
    const replying = ui.compose && ui.compose.threadId === root.id;
    return `<div class="thread ${root.resolved ? "resolved" : ""}">
      ${[root, ...replies].map(renderComment).join("")}
      ${locked() ? "" : replying ? renderComposer() : `<div class="row">
        <button class="btn quiet" data-act="reply" data-thread="${esc(root.id)}" data-slice="${esc(root.sliceId || "")}" data-scenario="${esc(root.scenarioId || "")}" data-part="${esc(root.part || "")}">Reply</button>
        ${root.resolved ? `<span class="muted">Resolved${root.resolvedNow ? " (not sent yet)" : ""}</span>` : `<button class="btn quiet" data-act="resolve" data-id="${esc(root.id)}">Resolve</button>`}</div>`}
    </div>`;
  }).join("");
}

function renderComment(c) {
  const part = c.part ? ` · on ${esc(c.part[0].toUpperCase() + c.part.slice(1))}` : "";
  return `<div class="cm ${c.author === "ai" ? "ai" : ""} ${c.draft ? "draft" : ""}">
    <span class="who"><b>${c.author === "ai" ? "AI" : "You"}</b>${c.at ? " · " + esc(c.at) : ""}${part}</span>
    <span>${c.problem ? `<span class="refuse">problem</span> ` : ""}${esc(c.text)} ${c.draft && !locked() ? `<button class="btn quiet" data-act="drop-comment" data-id="${esc(c.id)}">Remove</button>` : ""}</span></div>`;
}

function composerOrButton(target, label) {
  const open = ui.compose && ui.compose.kind === target.kind && !ui.compose.threadId &&
    (target.kind === "board" || (ui.compose.sliceId === target.sliceId && !ui.compose.scenarioId));
  if (open) return renderComposer();
  return `<div><button class="btn quiet" data-act="compose" data-kind="${target.kind}" data-slice="${esc(target.sliceId || "")}">${esc(label)}</button></div>`;
}

function renderComposer() {
  const c = ui.compose;
  const partSelect = c.kind === "scenario" && !c.threadId
    ? `<label class="f" for="cm-part">About<select id="cm-part"><option value="">the whole scenario</option><option value="given">Given</option><option value="when">When</option><option value="then">Then</option></select></label>` : "";
  return `<form class="composer" data-form="comment">
    ${partSelect}
    <label class="sr" for="cm-text">Comment</label>
    ${c.kind === "problem" ? `<strong>What doesn't work in ${esc(((model.slices || []).find(s => s.id === c.sliceId) || {}).name || "this slice")}?</strong>` : ""}
    <textarea id="cm-text" placeholder="${c.threadId ? "Reply…" : c.kind === "problem" ? "What did you try, and what happened?" : "What's wrong, missing or unclear?"}" required></textarea>
    <div class="row"><button class="btn primary" type="submit">${c.threadId ? "Reply" : c.kind === "problem" ? "Report problem" : "Add comment"}</button><button class="btn quiet" type="button" data-act="cancel">Cancel</button></div>
  </form>`;
}

function renderAddForm(sl) {
  const k = kindOf(sl), f = ui.form;
  const events = (model.events || []).map(e => e.name);
  const thenPart = k === "view"
    ? `<label class="f" for="add-shows">Then it shows<input type="text" id="add-shows" placeholder="e.g. only the open todos" value="${esc(f.shows)}"></label>`
    : `<div class="f">Then<div class="row">
        <label><input type="radio" name="add-outcome" value="event" ${f.outcome === "event" ? "checked" : ""}> it produces</label>
        <select id="add-event" aria-label="Event produced">${(sl.produces || events).map(e => `<option ${f.event === e ? "selected" : ""}>${esc(e)}</option>`).join("")}</select></div>
        <div class="row"><label><input type="radio" name="add-outcome" value="rejected" ${f.outcome === "rejected" ? "checked" : ""}> it's refused, because</label>
        <input type="text" id="add-reason" style="flex:1;min-width:180px" placeholder="the reason the person sees" value="${esc(f.reason)}"></div></div>`;
  return `<form class="composer" data-form="scenario">
    <strong>New scenario for ${esc(sl.name)}</strong>
    <label class="f" for="add-title">Title<input type="text" id="add-title" placeholder="e.g. Refuses a todo that is already done" value="${esc(f.title)}" required></label>
    <div class="f">Given (tap what has already happened, in order)<div class="chips">${events.map(e => `<button type="button" class="chip" data-act="add-given" data-event="${esc(e)}" aria-pressed="false">${esc(e)}</button>`).join("")}</div>
      <p class="muted" id="add-given-list">${f.given.length ? "Given: " + f.given.map(esc).join(", ") + ` <button type="button" class="btn quiet" data-act="add-given-clear">Clear</button>` : "Given: nothing yet"}</p></div>
    <p class="muted">When: ${k === "view" ? "someone opens " : ""}<code>${esc(sl.name)}</code></p>
    ${thenPart}
    <div class="row"><button class="btn primary" type="submit">Add scenario</button><button class="btn quiet" type="button" data-act="cancel">Cancel</button></div>
  </form>`;
}

function renderBar() {
  const c = counts();
  if (locked()) return `<div class="bar"><div class="wrap"><span>Saved <code>${esc(draft.sent)}</code>. Tell your AI: <b>done with feedback</b>. This page shows the next round when it's ready.</span></div></div>`;
  const parts = [];
  if (c.comments) parts.push(c.comments + " comment" + (c.comments > 1 ? "s" : ""));
  if (c.scenarios) parts.push(c.scenarios + " new scenario" + (c.scenarios > 1 ? "s" : ""));
  if (c.ticks) parts.push(c.ticks + " Refined change" + (c.ticks > 1 ? "s" : ""));
  if (c.resolved) parts.push(c.resolved + " resolved");
  if (c.works) parts.push(c.works + " tried and working");
  if (c.problems) parts.push(c.problems + " problem" + (c.problems > 1 ? "s" : ""));
  if (c.look) parts.push("look and feel");
  return `<div class="bar"><div class="wrap">
    <span class="muted">${parts.length ? "Your feedback this round: " + parts.join(" · ") : "No feedback yet this round."}</span>
    <button class="btn primary" data-act="done" ${parts.length && !ui.saving ? "" : "disabled"}>${ui.saving ? "Saving…" : "Done with feedback"}</button>
  </div></div>`;
}

function renderEmpty() {
  return `<main><div class="wrap"><div class="empty">
    <h1>No plan yet</h1>
    ${loadError ? `<p class="muted">Couldn't read <code>${esc(ROOT)}plan/model.json</code> (${esc(loadError)}).</p>` : ""}
    <p>Ask your AI: <b>let's plan a todo app</b> (or whatever you want to build). It writes the plan and this page shows it.</p>
    <p class="muted">Opened this file straight from disk? Start the book with <code>node eve/serve.mjs</code> and open <code>http://localhost:4747</code>.</p>
  </div></div></main>`;
}

/* ---------- actions ---------- */
async function finish() {
  const payload = { app: model.app, round: model.round, createdAt: new Date().toISOString(), events: draft.events };
  ui.saving = true; render();
  let saved = "";
  try {
    const res = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (res.ok) saved = (await res.json()).saved;
  } catch (e) { /* no server: fall back to a download */ }
  if (!saved) {
    const name = "round-" + model.round + ".json";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    saved = "plan/feedback/" + name + " (downloaded: move it into plan/feedback/)";
  }
  draft.sent = saved; ui.saving = false; saveDraft(); render();
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "refine") return;
  ev.preventDefault();
  switch (act) {
    case "compose": ui.compose = { kind: el.dataset.kind, sliceId: el.dataset.slice || undefined, scenarioId: el.dataset.scenario || undefined }; ui.addFor = null; render(); focus("cm-text"); break;
    case "reply": ui.compose = { kind: "reply", threadId: el.dataset.thread, sliceId: el.dataset.slice || undefined, scenarioId: el.dataset.scenario || undefined, part: el.dataset.part || undefined }; ui.addFor = null; render(); focus("cm-text"); break;
    case "cancel": ui.compose = null; ui.addFor = null; render(); break;
    case "resolve": add("CommentResolved", { commentId: el.dataset.id }); break;
    case "drop-comment": draft.events = draft.events.filter(e => !(e.type === "CommentAdded" && e.data.commentId === el.dataset.id)); saveDraft(); render(); break;
    case "drop-scenario": draft.events = draft.events.filter(e => !(e.type === "ScenarioAdded" && e.data.scenarioId === el.dataset.id)); saveDraft(); render(); break;
    case "add-open": ui.addFor = el.dataset.slice; ui.compose = null; ui.form = { title: "", given: [], outcome: "event", event: "", reason: "", shows: "" }; render(); focus("add-title"); break;
    case "add-given": readForm(); ui.form.given.push(el.dataset.event); render(); break;
    case "add-given-clear": readForm(); ui.form.given = []; render(); break;
    case "done": finish(); break;
    case "look-open": { const L = view().look; ui.lookForm = { ...blankLook(), ...(L || {}), moods: [...((L && L.moods) || [])], colours: [...((L && L.colours) || [])] }; ui.compose = null; ui.addFor = null; render(); break; }
    case "look-cancel": ui.lookForm = null; render(); break;
    case "look-mood": { readLookForm(); const m = el.dataset.mood, ms = ui.lookForm.moods; ms.includes(m) ? ms.splice(ms.indexOf(m), 1) : ms.push(m); render(); break; }
    case "look-colour-add": readLookForm(); ui.lookForm.colours.push("#3f76db"); render(); focus("look-colour-" + (ui.lookForm.colours.length - 1)); break;
    case "look-colour-drop": readLookForm(); ui.lookForm.colours.splice(+el.dataset.i, 1); render(); break;
    case "eve-seen": try { localStorage.setItem("eve-seen-version", ui.eveUpdated.version); } catch (e) {} ui.eveUpdated = null; render(); break;
    case "app-width": ui.appWidth = el.dataset.w; render(); break;
    case "export-em": downloadForEventmodelers(); break;
    case "mode": ui.mode = el.dataset.mode;
      // The Look tab opens straight on the form while nothing has been filled in yet.
      if (ui.mode === "look" && !ui.lookForm && !locked() && !view().look) ui.lookForm = blankLook(); if (ui.mode === "book" || ui.mode === "board") try { localStorage.setItem("eve-mode", ui.mode); } catch (e) {} render(); scrollTo(0, 0); break;
    case "goto": {
      const sl = (model.slices || []).find(s => s.id === el.dataset.slice); if (!sl) break;
      ui.mode = "book"; ui.filter = "all"; ui.q = ""; try { localStorage.setItem("eve-mode", "book"); } catch (e) {}
      ui.openDone.add(sl.id); if (sl.chapter) ui.openDone.add("ch:" + sl.chapter); setFolded(sl.id, false);
      render();
      const t = document.getElementById("slice-" + sl.id);
      if (t) scrollTo({ top: t.getBoundingClientRect().top + scrollY - 110 });
      break;
    }
    case "fold": { const id = el.dataset.slice; setFolded(id, !folded().has(id)); render(); const t = document.getElementById("slice-" + id); if (t && t.getBoundingClientRect().top < 90) scrollTo({ top: t.getBoundingClientRect().top + scrollY - 110 }); break; }
    case "works": { const id = el.dataset.slice, i = draft.events.findIndex(e => e.type === "SliceWorks" && e.data.sliceId === id); i >= 0 ? draft.events.splice(i, 1) : draft.events.push({ type: "SliceWorks", data: { sliceId: id }, at: stamp() }); saveDraft(); render(); break; }
    case "sc-open": { const k = el.dataset.key; ui.openSc.has(k) ? ui.openSc.delete(k) : ui.openSc.add(k); render(); break; }
    case "filter": ui.filter = el.dataset.f; render(); break;
    case "fold-all": { const V = view(); for (const s of model.slices || []) if (V.refined[s.id]) setFolded(s.id, el.dataset.on === "1"); render(); break; }
    case "toggle-done": { const k = el.dataset.key; ui.openDone.has(k) ? ui.openDone.delete(k) : ui.openDone.add(k); render(); break; }
    case "reload": ui.newRound = false; ui.compose = null; ui.addFor = null; modelText = ""; loadAll(true); break;
  }
});

document.addEventListener("input", ev => { if (ev.target.id === "q") { ui.q = ev.target.value; render(); } });
document.addEventListener("keydown", ev => { if (ev.target.id === "q" && ev.key === "Escape" && ui.q) { ui.q = ""; render(); } });

document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.act !== "refine") return;
  const id = el.dataset.slice;
  // Ticking Refined folds the slice to one line; unticking opens it. Keep its row where it was on screen.
  setFolded(id, el.checked);
  const art = document.getElementById("slice-" + id), before = art ? art.getBoundingClientRect().top : null;
  requestAnimationFrame(() => { const now = document.getElementById("slice-" + id); if (now && before != null) scrollBy(0, now.getBoundingClientRect().top - before); });
  const mine = draft.events.findIndex(e => (e.type === "SliceMarkedRefined" || e.type === "SliceRefinedCleared") && e.data.sliceId === id);
  if (mine >= 0) { draft.events.splice(mine, 1); saveDraft(); render(); }
  else add(el.checked ? "SliceMarkedRefined" : "SliceRefinedCleared", { sliceId: id });
});

document.addEventListener("submit", ev => {
  ev.preventDefault();
  const form = ev.target.dataset.form;
  if (form === "comment") {
    const text = document.getElementById("cm-text").value.trim();
    if (!text) return;
    const c = ui.compose, partEl = document.getElementById("cm-part");
    const data = { commentId: uid("c"), text, nickname: "you", at: stamp() };
    if (c.sliceId) data.sliceId = c.sliceId;
    if (c.scenarioId) data.scenarioId = c.scenarioId;
    if (partEl && partEl.value) data.part = partEl.value;
    if (c.part) data.part = c.part;
    if (c.threadId) data.threadId = c.threadId;
    if (c.kind === "problem") { data.problem = true; draft.events = draft.events.filter(e => !(e.type === "SliceWorks" && e.data.sliceId === c.sliceId)); }
    ui.compose = null;
    add("CommentAdded", data);
  } else if (form === "look") {
    readLookForm();
    const f = ui.lookForm, data = { ...f, likes: f.likes.trim(), where: f.where.trim(), notes: f.notes.trim() };
    ui.lookForm = null;
    draft.events = draft.events.filter(e => e.type !== "LookAndFeelSet");
    add("LookAndFeelSet", data);
  } else if (form === "scenario") {
    readForm();
    const f = ui.form, sl = model.slices.find(s => s.id === ui.addFor), k = kindOf(sl);
    if (!f.title.trim()) return focus("add-title");
    const then = k === "view" ? { view: sl.name, value: f.shows.trim() }
      : f.outcome === "rejected" ? { rejected: f.reason.trim() } : { events: [{ type: f.event || (sl.produces || [])[0] }] };
    ui.addFor = null;
    add("ScenarioAdded", { scenarioId: uid("s"), sliceId: sl.id, name: f.title.trim(), given: f.given.map(t => ({ type: t })), when: sl.name, then });
  }
});

/* ---------- look and feel: what "make it beautiful" designs from ---------- */
const MOODS = ["Calm", "Playful", "Bold", "Minimal", "Warm", "Cosy", "Elegant", "Techy", "Fresh", "Serious"];
const TYPES = ["Rounded and friendly", "Clean and modern", "Classic, with serifs", "Handwritten", "Typewriter / code"];
const THEMES = [["light", "Light"], ["dark", "Dark"], ["both", "Both (follow the device)"], ["", "No preference"]];
const DEVICES = [["phone", "Mostly on a phone"], ["laptop", "Mostly on a laptop"], ["both", "Both"]];
const blankLook = () => ({ moods: [], colours: [], theme: "", type: "", likes: "", device: "", where: "", notes: "" });

function lookSummary(L) {
  const bits = [];
  if (L.moods && L.moods.length) bits.push(L.moods.map(esc).join(", "));
  if (L.colours && L.colours.length) bits.push(L.colours.map(c => `<span class="dot-sw" style="background:${esc(c)}" title="${esc(c)}"></span>`).join(" "));
  const theme = THEMES.find(t => t[0] === L.theme && t[0]); if (theme) bits.push(esc(theme[1]));
  if (L.type) bits.push(esc(L.type));
  const dev = DEVICES.find(d => d[0] === L.device); if (dev) bits.push(esc(dev[1]) + (L.where ? ", " + esc(L.where) : ""));
  else if (L.where) bits.push(esc(L.where));
  if (L.likes) bits.push("like " + esc(L.likes));
  return bits.join(" · ");
}
function renderLook(V) {
  const L = V.look;
  if (ui.lookForm) return renderLookForm();
  const has = L && lookSummary(L);
  return `<section class="look" aria-label="Look and feel">
    <div class="row spread"><strong>Look and feel</strong>${!locked() ? `<button class="btn quiet" data-act="look-open">${has ? "Change" : "Fill in"}</button>` : ""}</div>
    ${has ? `<p>${lookSummary(L)}${V.lookNew ? ` <span class="muted">(not sent yet)</span>` : ""}</p>${L.notes ? `<p class="muted">${esc(L.notes)}</p>` : ""}`
      : `<p class="muted">How should your app feel? Your AI designs from this when you say <b>make it beautiful</b>. Fill it in any time.</p>`}
  </section>`;
}
function renderLookForm() {
  const f = ui.lookForm;
  const radio = (name, opts, cur) => opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${cur === v ? "checked" : ""}> ${esc(l)}</label>`).join("");
  return `<form class="look" data-form="look" aria-label="Look and feel">
    <strong>Look and feel</strong>
    <div class="f"><span class="muted">How should it feel? Pick any.</span><div class="chips">${MOODS.map(m => `<button type="button" class="chip" data-act="look-mood" data-mood="${esc(m)}" aria-pressed="${f.moods.includes(m)}">${esc(m)}</button>`).join("")}</div></div>
    <div class="f"><span class="muted">Colours you like (up to 4)</span><div class="swatches">
      ${f.colours.map((c, i) => `<span class="swatch"><input type="color" id="look-colour-${i}" value="${esc(c)}" aria-label="Colour ${i + 1}"><button type="button" class="btn quiet" data-act="look-colour-drop" data-i="${i}" aria-label="Remove colour ${i + 1}">✕</button></span>`).join("")}
      ${f.colours.length < 4 ? `<button type="button" class="btn quiet" data-act="look-colour-add">+ Add a colour</button>` : ""}</div></div>
    <div class="f"><span class="muted">Light or dark</span><div class="row">${radio("look-theme", THEMES, f.theme)}</div></div>
    <div class="f"><span class="muted">Lettering</span><div class="row">${radio("look-type", TYPES.map(t => [t, t]).concat([["", "No preference"]]), f.type)}</div></div>
    <label class="f" for="look-likes">Apps or sites whose look you like<input type="text" id="look-likes" placeholder="e.g. Notion, the IKEA app, a link" value="${esc(f.likes)}"></label>
    <div class="f"><span class="muted">Where it gets used</span><div class="row">${radio("look-device", DEVICES, f.device)}</div>
      <input type="text" id="look-where" placeholder="e.g. in a cold storage room, one hand full" value="${esc(f.where)}" aria-label="Where it gets used"></div>
    <label class="f" for="look-notes">Anything else<textarea id="look-notes" placeholder="e.g. big buttons, nothing too cute">${esc(f.notes)}</textarea></label>
    <div class="row"><button class="btn primary" type="submit">Save look and feel</button><button class="btn quiet" type="button" data-act="look-cancel">Cancel</button></div>
  </form>`;
}
function readLookForm() {
  const f = ui.lookForm; if (!f) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  const r = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ""; };
  f.colours = f.colours.map((c, i) => v("look-colour-" + i) || c);
  f.theme = r("look-theme"); f.type = r("look-type"); f.device = r("look-device");
  f.likes = v("look-likes"); f.where = v("look-where"); f.notes = v("look-notes");
}

function readForm() {
  const f = ui.form; if (!f) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  f.title = v("add-title"); f.reason = v("add-reason"); f.shows = v("add-shows"); f.event = v("add-event");
  const r = document.querySelector('input[name="add-outcome"]:checked'); if (r) f.outcome = r.value;
}
function focus(id) { const el = document.getElementById(id); if (el) el.focus(); }

loadAll(true);
// Fold the header after scrolling a little; open it again near the top. The gap between the two stops it flickering.
addEventListener("scroll", () => {
  const y = scrollY, on = document.body.classList.contains("scrolled");
  if (!on && y > 80) document.body.classList.add("scrolled");
  else if (on && y < 16) document.body.classList.remove("scrolled");
}, { passive: true });
checkEveVersion();

// After "update EVE": say once what's new, from this copy's own release notes. A first visit just remembers the version.
function showUpdatedNotes(local) {
  try {
    const KEY = "eve-seen-version", seen = localStorage.getItem(KEY), mine = local.version || "";
    if (!seen) { localStorage.setItem(KEY, mine); return; }
    const key = v => { const m = /^(\d{4}-\d{2}-\d{2})(?:\.(\d+))?/.exec(v || ""); return m ? [m[1], +(m[2] || 1)] : ["", 0]; };
    const newer = (a, b) => { const x = key(a), y = key(b); return x[0] !== y[0] ? x[0] > y[0] : x[1] > y[1]; };
    if (!newer(mine, seen)) return;
    ui.eveUpdated = { version: mine, notes: (local.releases || []).filter(r => newer(r.version, seen)).flatMap(r => r.notes || []).slice(0, 8) };
    render();
  } catch (e) { /* no storage: skip */ }
}
// Say when a newer EVE is out. Only when running on someone's own machine; quiet when offline.
async function checkEveVersion() {
  if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
  try {
    const local = await (await fetch("version.json", { cache: "no-store" })).json();
    const mine = local.version || "";
    showUpdatedNotes(local);
    // GitHub's API serves the file fresh (60 requests an hour per network); its raw file server can lag minutes behind.
    const api = "https://api.github.com/repos/jocelynenglund/itsybit-eve-template/contents/eve/version.json";
    const raw = "https://raw.githubusercontent.com/jocelynenglund/itsybit-eve-template/main/eve/version.json";
    let res = await fetch(api, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" }).catch(() => null);
    if (!res || !res.ok) res = await fetch(raw, { cache: "no-store" });
    const remote = await res.json();
    const latest = remote.version || "";
    // "2026-11-01.10" is newer than "2026-11-01.9": compare the date, then the release number.
    const key = v => { const m = /^(\d{4}-\d{2}-\d{2})(?:\.(\d+))?/.exec(v || ""); return m ? [m[1], +(m[2] || 1)] : ["", 0]; };
    const newer = (a, b) => { const x = key(a), y = key(b); return x[0] !== y[0] ? x[0] > y[0] : x[1] > y[1]; };
    if (newer(latest, mine)) {
      ui.eveUpdate = mine ? `You have ${mine}; the newest is ${latest}` : `The newest is ${latest}`;
      ui.eveNotes = (remote.releases || []).filter(r => !mine || newer(r.version, mine)).flatMap(r => r.notes || []).slice(0, 6);
      render();
    }
  } catch (e) { /* offline, or an older copy without version.json */ }
}
setInterval(() => loadAll(false), POLL_MS);
</script>
