# Publishes this repo's site (eve/site/index.html, the Event Book, the sample) to GitHub Pages,
# with whats-new.json generated from git for the What's new pill.
# Only runs in the original repo: a copy made from the template skips it.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'jocelynenglund/itsybit-eve-template'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node eve/test.mjs eve/sample/todo
      # The site's files live in eve/site/. Put the published site together so every old link still works:
      # / (eve/site/index.html), /site/ (its images and the What's-new pill), /eve/ (the Event Book, the
      # sample at /eve/sample/), and /sample/ (where the sample used to be).
      - name: Assemble the site
        run: |
          mkdir -p _site/site
          cp eve/site/index.html _site/index.html
          cp -r eve/site/. _site/site/
          cp -r eve _site/eve
          cp -r eve/sample _site/sample
          eve/site/whats-new.sh _site/whats-new.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
