# The Event Book's own tests: views, components and structure (nothing to install), then the browser tests.
name: Book tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "eve/book/tests/*.test.mjs"
      - run: node eve/test.mjs eve/sample/todo
      - run: npm ci
        working-directory: eve/dev
      - run: npx playwright install --with-deps chromium
        working-directory: eve/dev
      - run: npm test
        working-directory: eve/dev
